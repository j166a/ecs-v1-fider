name: Terraform Validate

on:
  pull_request:
    branches:
      - main
    paths:
      - "infra/**"
      - ".github/workflows/terraform-validate.yaml"

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.4"

      - name: Check formatting
        run: terraform fmt -check -recursive infra

      - name: Initialise bootstrap
        working-directory: infra/bootstrap
        run: terraform init -backend=false

      - name: Validate bootstrap
        working-directory: infra/bootstrap
        run: terraform validate

      - name: Initialise dev environment
        working-directory: infra/environments/dev
        run: terraform init -backend=false

      - name: Validate dev environment
        working-directory: infra/environments/dev
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: v0.64.0

      - name: Initialise TFLint
        run: tflint --init

      - name: Run TFLint
        run: tflint --recursive

  plan:
    needs: terraform
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.4"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Initialise dev environment
        working-directory: infra/environments/dev
        run: terraform init

      - name: Terraform plan
        working-directory: infra/environments/dev
        run: terraform plan -no-color
