name: Terraform Validate

on:
  pull_request:
    branches:
      - main
    paths:
      - "infra/**"
      - ".github/workflows/terraform-validate.yaml"

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.4"

      - name: Check formatting
        run: terraform fmt -check -recursive infra

      - name: Initialise bootstrap
        working-directory: infra/bootstrap
        run: terraform init -backend=false

      - name: Validate bootstrap
        working-directory: infra/bootstrap
        run: terraform validate

      - name: Initialise dev environment
        working-directory: infra/environments/dev
        run: terraform init -backend=false

      - name: Validate dev environment
        working-directory: infra/environments/dev
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: v0.64.0

      - name: Initialise TFLint
        run: tflint --init

      - name: Run TFLint
        run: tflint --recursive

      - name: Run Checkov action
        uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf # v12.1347.0
        with:
          directory: infra/
          compact: true
          quiet: true
          soft_fail: true
          framework: terraform

  plan:
    needs: terraform
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      TF_VAR_base_url: ${{ vars.TF_VAR_base_url }}
      TF_VAR_vpc_cidr: ${{ vars.TF_VAR_vpc_cidr }}
      TF_VAR_domain_name: ${{ vars.TF_VAR_domain_name }}
      TF_VAR_route53_zone_id: ${{ vars.TF_VAR_route53_zone_id }}
      TF_VAR_image_tag: ${{ vars.TF_VAR_image_tag }}
      TF_VAR_email_noreply: ${{ vars.TF_VAR_email_noreply }}
      TF_VAR_jwt_secret: ${{ secrets.TF_VAR_jwt_secret }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_availability_zones: ${{ vars.AVAILABILITY_ZONES }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.4"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Initialise dev environment
        working-directory: infra/environments/dev
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"

      - name: Terraform plan
        working-directory: infra/environments/dev
        run: terraform plan -no-color -input=false
