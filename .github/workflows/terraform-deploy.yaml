name: Terraform Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    environment: dev
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      TF_VAR_base_url: ${{ vars.TF_VAR_base_url }}
      TF_VAR_vpc_cidr: ${{ vars.TF_VAR_vpc_cidr }}
      TF_VAR_ses_identity_arn: ${{ vars.TF_VAR_ses_identity_arn }}
      TF_VAR_domain_name: ${{ vars.TF_VAR_domain_name }}
      TF_VAR_route53_zone_id: ${{ vars.TF_VAR_route53_zone_id }}
      TF_VAR_image_tag: ${{ vars.TF_VAR_image_tag }}
      TF_VAR_email_noreply: ${{ vars.TF_VAR_email_noreply }}
      TF_VAR_jwt_secret: ${{ secrets.TF_VAR_jwt_secret }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.4"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_INFRA_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Initialise dev environment
        working-directory: infra/environments/dev
        run: terraform init -input=false

      - name: Create deployment plan
        working-directory: infra/environments/dev
        run: terraform plan -no-color -input=false -out=tfplan

      - name: Apply deployment plan
        working-directory: infra/environments/dev
        run: terraform apply -no-color -input=false tfplan
