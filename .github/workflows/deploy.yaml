name: App Deploy

on:
  workflow_run:
    workflows:
      - Build and Push Image
    types:
      - completed
    branches:
      - main

permissions:
  id-token: write
  contents: read

concurrency:
  group: app-deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/reusable-ecs-deploy.yaml
    with:
      aws_region: ${{ vars.AWS_REGION }}
      cluster: fider-dev-cluster
      service: fider-dev-service
      container_name: fider-dev
      ecr_repository: ${{ vars.ECR_REPOSITORY }}
      image_tag: ${{ github.event.workflow_run.head_sha }}
      environment: dev
    secrets: inherit
